name: Lineage and Build Gates

# This workflow consumes no event-supplied text: every step runs a fixed
# command against the checked-out tree. Keep it that way — interpolating
# ${{ github.event.* }} into a run: block would open a command-injection path.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lineage-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # Runs first and gates everything else: an original-authorship or
      # upstream-marker violation should fail before any build work happens.
      - name: Lineage gates
        run: go test ./tests/lineage/...

  build:
    runs-on: ubuntu-latest
    needs: lineage-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  conformance:
    runs-on: ubuntu-latest
    needs: lineage-gates
    timeout-minutes: 30
    # Contract suites run against a real PostgreSQL 15 service container,
    # never testcontainers. The session suite runs WITHOUT WithMay per the
    # fixture's actual form: its LazyExpiryReclaimsOnRead MAY case is not
    # implementable (story 1.11) — do not force MAY options in CI.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: wicket_pg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WICKET_PG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wicket_pg_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Contract suites
        run: GOWORK=off go test ./tests/conformance/...
